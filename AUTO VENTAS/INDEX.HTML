<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoVentas </title>
<style>
body{font-family:Arial;margin:0;background:#f4f4f4;}
header{background:#111;color:white;text-align:center;padding:20px;}
.container{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}
.card{background:white;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,0.1);padding:15px;text-align:center;}
.card img{width:100%;border-radius:10px;}
.price{color:green;font-size:20px;font-weight:bold;}
button{background:#e60000;color:white;border:none;padding:10px;border-radius:5px;cursor:pointer;}
button:hover{background:#cc0000;}
footer{background:#111;color:white;text-align:center;padding:15px;margin-top:20px;}
</style>
</head>
<body>

<header>
<h1>🚗 VENTAS ANAHI CAR</h1>
<p>Los mejores autos al mejor precio</p>
</header>

<div class="container">

<div class="card">
<img src="https://source.unsplash.com/400x300/?car,toyota">
<h3>Toyota Corolla 2018</h3>
<p class="price">$215,000 MXN</p>
<p>Automático, excelente estado.</p>
<button onclick="alert('Contáctanos al 899-123-4567')">Me interesa</button>
</div>

<div class="card">
<img src="https://source.unsplash.com/400x300/?car,chevrolet">
<h3>Chevrolet Silverado 2016</h3>
<p class="price">$320,000 MXN</p>
<p>Pickup V8 lista para trabajo.</p>
<button onclick="alert('Contáctanos al 899-123-4567')">Me interesa</button>
</div>

</div>

<footer>
📞 899-123-4567 | Reynosa, Tamaulipas
</footer>

</body>
</html>
